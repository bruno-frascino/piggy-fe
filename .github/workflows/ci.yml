name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Lint, test, build, context and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build

      - name: Verify context/ is up to date
        run: yarn context:check

      - name: Checkout backend contract source
        uses: actions/checkout@v4
        with:
          repository: bruno-frascino/piggy-api
          ref: main
          path: .contract-source/piggy-api
          sparse-checkout: context/openapi.json
          sparse-checkout-cone-mode: false

      - name: Verify backend contract is current
        env:
          PIGGY_API_PATH: ${{ github.workspace }}/.contract-source/piggy-api
        run: yarn contract:check
